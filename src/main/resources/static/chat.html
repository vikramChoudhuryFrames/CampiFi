<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampiFi — Chat</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/sockjs.min.js"></script>
    <script src="/stomp.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <!-- ── Header ───────────────────────────────────────────────── -->
        <div class="chat-header">
            <div class="chat-header-left">
                <a href="/channels.html" class="back-btn">← Back</a>
                <span class="brand-small">CampiFi</span>
                <span class="room-label" id="roomName"></span>
            </div>
            <div class="chat-header-right">
                <span id="memberCount">0 members</span>
            </div>
        </div>

        <!-- ── Online members strip ─────────────────────────────────── -->
        <div class="chat-members">
            <span class="members-label">Online:</span>
            <span id="membersList"></span>
        </div>

        <!-- ── Upload progress bar ──────────────────────────────────── -->
        <div class="upload-progress-bar" id="uploadProgressBar" style="display:none;">
            <div class="upload-progress-fill" id="uploadProgressFill"></div>
        </div>
        <div class="upload-status-row" id="uploadStatusRow" style="display:none;">
            <span class="upload-status-text" id="uploadStatusText">Uploading…</span>
        </div>

        <!-- ── Messages Area ────────────────────────────────────────── -->
        <div class="chat-messages" id="chatMessages">
            <div class="system-message">Connecting…</div>
        </div>

        <!-- ── Input Bar ────────────────────────────────────────────── -->
        <div class="chat-input">
            <!-- Hidden native file input -->
            <input type="file" id="fileInput"
                   accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip,.rar"
                   style="position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; z-index:-1;">

            <!-- Label attached to fileInput: clicking natively opens file dialog -->
            <label for="fileInput" class="btn-paperclip" id="paperclipBtn" title="Attach picture or document" style="cursor:pointer;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                </svg>
            </label>

            <form id="messageForm">
                <input type="text" id="messageInput" placeholder="Type a message…" autocomplete="off">
                <button type="submit" class="btn-send">Send</button>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        (function() {
            var urlParams    = new URLSearchParams(window.location.search);
            var room         = urlParams.get('room') || 'General';
            var user         = urlParams.get('user') || sessionStorage.getItem('campifi_name') || 'User';

            // Connect chat
            initChat(room, user);

            // Double fallback: also attach explicit click handler on paperclipBtn
            var paperclip = document.getElementById('paperclipBtn');
            var fileInp   = document.getElementById('fileInput');

            if (paperclip && fileInp) {
                paperclip.addEventListener('click', function(e) {
                    // Triggers file dialog
                    try { fileInp.click(); } catch(err) {}
                });

                fileInp.addEventListener('change', function() {
                    if (fileInp.files && fileInp.files.length > 0) {
                        uploadAndSend(fileInp.files[0], room, user);
                        fileInp.value = '';
                    }
                });
            }
        })();
    </script>
</body>
</html>
